# Git 平台推送配置
# 1 = 启用推送, 0 = 禁用推送

platforms:
  github:
    enabled: 0
    remote: github
    additionalGitignoreFile: '.cheezmil_quick_git/config/additional-github-gitignore.txt'
    pushRefspec: 'main:main'
    owner: cheezmil
    tokenFilePath: '"D:\MyNotes\pw\github\cheezmil\pw-pat-classic-cheezimil.txt"'
    remoteUrl: 'https://github.com/{owner}/{current_working_directory_name}'
    primary: false
  gitea:
    enabled: 1
    primary: true
    remote: gitea
    additionalGitignoreFile: '.cheezmil_quick_git/config/additional-gitea-gitignore.txt'
    pushRefspec: 'main:main'
    owner: AlexanderDash
    tokenFilePath: 'D:\MyNotes\pw\gitea\pw_gitea.txt'
    remoteUrl: ''
  gitee:
    enabled: 0
    remote: gitee
    additionalGitignoreFile: '.cheezmil_quick_git/config/additional-gitee-gitignore.txt'
    pushRefspec: ''
    owner: ''
    tokenFilePath: ''
    remoteUrl: ''
    primary: false
  gitcode:
    enabled: 0
    remote: gitcode
    additionalGitignoreFile: '.cheezmil_quick_git/config/additional-gitcode-gitignore.txt'
    pushRefspec: ''
    owner: AlexanderDash
    tokenFilePath: 'D:\MyNotes\pw\gitcode\pw-t-AlexanderDash.txt'
    remoteUrl: ''
    primary: false
  atomgit:
    enabled: 0
    remote: atomgit
    additionalGitignoreFile: '.cheezmil_quick_git/config/additional-atomgit-gitignore.txt'
    pushRefspec: ''
    owner: ''
    tokenFilePath: ''
    remoteUrl: ''
    primary: false
settings:
  pushSequentially: 1
  continueOnError: 0
  showSummary: 1
  defaultAdditionalGitignoreFile: '.cheezmil_quick_git/config/additional-gitea-gitignore.txt'
  gitea_remote_protocol: http
  gitea_host: 127.0.0.1
  gitea_http_port: 3000
  gitea_ssh_port: 3001
  gitea_ssh_user: git
  custom_other_version_path: ''
  myOwnNames:
    - AlexanderDash
    - cheezmil

  # 嵌套 Git 仓库处理配置
  # 当父仓库目录内包含子目录也存在 .git（嵌套 git 仓库）时，cqg acp 如何处理。
  # 可选模式：
  #   "rename"（默认）— 将嵌套 .git 永久重命名为 .git-nested-managed-by-cqg，使嵌套仓库内容被父仓库当普通文件跟踪。
  #                     .git 原始数据完整保留在 .git-nested-managed-by-cqg 中，后续可恢复或 pull 上游。
  #                     自动在父仓库 .gitignore 中添加 .git-nested-managed-by-cqg/ 排除。
  #   "7z"      — 将嵌套 .git 压缩为 .7z 归档后移除，释放空间但不可逆（恢复需解压）。
  #   "skip"    — 跳过嵌套仓库，保持其不被父仓库跟踪（旧默认行为）。
  # 注意：已注册的 git submodule（.gitmodules + index gitlink 160000）始终跳过，不受此配置影响。
  nestedGitHandling:
    enabled: 1
    # 扫描嵌套 git 的最大目录深度（层数）。
    # 例如 scanDepth=8 表示最多向下递归 8 层目录寻找嵌套 .git。
    # 设为 0 表示不限制深度（扫描全部，大项目可能影响性能）。
    # 推荐值：8（默认）
    scanDepth: 8
    mode: rename