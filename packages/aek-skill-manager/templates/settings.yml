# aek-skill-manager 配置文件
# 位置：~/.aek/skill-manager/settings.yml（全局）

# 在 aeksm gen 前自动执行 transfer-sync，对齐 WSL 与 Windows 的中心仓库
transferSyncBeforeGen: true

# transfer-sync 覆盖前备份保留的份数（最近 N 个）
transferBackupKeep: 3

# skill 生成目标目录的工作方式
#   2：写入各工具自有目录（原有逻辑，全部工具都写自己的目录）
#   1：支持社区共用目录的 agent 只写入 ~/.agents/skills（项目级 ./.agents/skills），
#      由这些工具从共用目录读取；不读共用目录的工具仍写各自的工作目录
genTargetMode: 2

# 说明（genTargetMode: 1 时的分工，按作用域分三档）——
# A. 全局+项目都读 ~/.agents/skills（gen 无论 scope 都走共用）：
#   codex、cursor、vscode、copilot、gemini、opencode、windsurf、cline、pi、
#   openclaw、deepseek-harness、qwencode、kilocode
# B. 只在项目级读 .agents/skills（项目 gen 走共用；全局 gen 仍走各自目录）：
#   hermes、antigravity
# C. 不共用、始终写各自目录：
#   claude、claude-desktop、cherry-studio、chatbox、continue、qoder、kiro、
#   workbuddy、zcode、trae、trae-cn
# 判据来自逐个 clone 源码 grep（qwen/kilocode/opencode/cline/pi/hermes/continue/
# gemini/claude 实测）或官方文档；闭源 IDE 无法核实者留在 C，避免误判把 skill 丢掉。

# 默认生成到的工具列表（不带 --tools 时生效），不填写则生成全部
# 示例：[hermes, deepseek-harness]
genDefaultTools: [hermes, deepseek-harness]

# 缓存探测到的 WSL 发行版名（Windows 侧使用），失效时自动清理重新探测
# wslDistro: null
