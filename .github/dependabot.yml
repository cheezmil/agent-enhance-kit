# 本仓库不需要自动的版本升级 PR
# 注意 open-pull-requests-limit: 0 只压住「版本更新」，有漏洞时 Dependabot 仍会开
# security update PR；那种要停得去 Settings → Code security and analysis 关掉。
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/packages/*"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: gomod
    directories:
      - "/packages/*"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: pip
    directories:
      - "/packages/aek-task-manager/eval"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
